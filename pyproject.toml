[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "FetchYT"
version = "0.1.0"
description = "A sleek, modular YouTube downloader built with PySide6 and yt-dlp"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.0",
    "yt-dlp>=2024.1.0",
    "imageio-ffmpeg>=0.4.9",
]

[project.scripts]
FetchYT = "main:main"

[tool.setuptools]
packages = ["core", "ui"]
py-modules = ["main", "styles"]

[tool.setuptools.package-data]
core = ["bin/node.exe"]